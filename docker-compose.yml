version: '3.3'

services:
  dr-mocks:
    image: dci-dr-mocks
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3333:3003" # DR registry endpoints (search, subscribe, get-disability-*, disabled, ...)
      - "3334:3004" # SP callback endpoints (on-search, notify, ...)
    extra_hosts:
      # lets the mock call back the test runner's listener (header.sender_uri)
      - "host.docker.internal:host-gateway"
    networks:
      - web

networks:
  web:
    driver: bridge
